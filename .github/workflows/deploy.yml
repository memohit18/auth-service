name: Deploy Auth Service

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script_stop: true
          command_timeout: 15m

          script: |
            set -e

            cd /var/www/services/auth-service

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing dependencies..."
            npm ci

            echo "Generating Prisma..."
            npx prisma generate --schema=db-schema/postgres/prisma/schema.prisma

            echo "Cleaning build cache..."
            rm -rf dist
            rm -f tsconfig.build.tsbuildinfo

            echo "Building..."
            npm run build

            echo "Restarting PM2..."
            pm2 restart auth-service --update-env || pm2 start ecosystem.config.js

            pm2 save

            echo "Waiting for service..."
            sleep 10

            echo "Local Health Check..."
            curl --fail http://localhost:3302/health

      - name: Public Health Check
        run: |
          echo "Waiting for service..."
          sleep 10

          curl --fail https://auth.algoarena.co.in/health